# Xcode project for the App Store builds. Generate with: xcodegen generate
# (build.sh still builds a local, unsandboxed Mac app and the magic-time command without Xcode;
# the MagicTime-macOS target is the sandboxed Mac App Store build.)
name: MagicTime
options:
  bundleIdPrefix: cc.covell
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PHYC7GJW6B
targets:
  MagicTime-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
      - path: Sources/TimeParser.swift
      - path: Sources/NaturalTime.swift
      - path: Sources/Holidays.swift
      - path: Sources/HinduFestivals.swift
      - path: Sources/PhraseHelper.swift
      - path: Icon/AppIcon.icon
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_NAME: Magic Time
        PRODUCT_BUNDLE_IDENTIFIER: cc.covell.magictime
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Magic Time
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  MagicTime-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Icon/AppIcon.icon
        buildPhase: resources
        type: file
    entitlements:
      path: macOS/MagicTime.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: Magic Time
        PRODUCT_BUNDLE_IDENTIFIER: cc.covell.magictime
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Magic Time
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 CJ Covell"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
